<!DOCTYPE html>
<html>
<head>
    <title>Register via API</title>
</head>
<body>
    <h2>User Registration</h2>

    <form id="registerForm" action="user-register">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="text" name="first_name" placeholder="First Name" required><br>
        <input type="text" name="last_name" placeholder="Last Name" required><br>
        <input type="text" name="phone_number" placeholder="Phone Number" required><br>
        <input type="password" name="password1" placeholder="Password" required><br>
        <input type="password" name="password2" placeholder="Confirm Password" required><br>
        <button type="submit">Register</button>
    </form>

    <div id="result"></div>

    <script>
        // Helper function to get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    
        // Attach form submit event listener
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault(); // Prevent form from refreshing page
    
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
    
            // Send form data using fetch with CSRF token in header
            const response = await fetch("/api/register/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken") // CSRF protection
                },
                body: JSON.stringify(data)
            });
    
            const resultDiv = document.getElementById("result");
    
            if (response.ok) {
                const result = await response.json();
                resultDiv.innerHTML = `<p style="color: green;">${result.message}</p>`;
                form.reset(); // Clear the form
            } else {
                const errors = await response.json();
                let html = "<ul style='color: red;'>";
                for (let field in errors) {
                    html += `<li>${field}: ${errors[field]}</li>`;
                }
                html += "</ul>";
                resultDiv.innerHTML = html;
            }
        });
    </script>
    
</body>
</html>
